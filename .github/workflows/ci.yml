name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build deps
        if: runner.os == 'Linux'
        # libgtk-3-dev, libayatana-appindicator3-dev and libxdo-dev are the
        # tray icon: pheme-app now links GTK 3 and libappindicator on Linux.
        # libxcb-render0-dev, libxcb-shape0-dev, libxcb-xfixes0-dev and
        # libxkbcommon-dev are eframe's own native (winit/glow) build deps,
        # the same set egui's own CI installs for a native Linux build.
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxfixes-dev libxrandr-dev libpipewire-0.3-dev libspa-0.2-dev clang pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
