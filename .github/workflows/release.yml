name: release

# Tagging `v*` publishes a GitHub release with binaries attached. Running this
# workflow by hand from the Actions tab builds the same binaries and leaves them
# as downloadable artifacts, which is the way to get a build without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-linux
          - os: windows-latest
            name: x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # A tag of v0.2.0 against a crate at 0.1.0 would produce
      # pheme_0.1.0_amd64.deb inside a release called v0.2.0. Fail before
      # anything is built rather than publish files that disagree with
      # their own release name.
      - name: The tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        run: |
          v=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name=="pheme-app") | .version')
          test "v$v" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match crate version $v"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      # Same packages as the ci workflow: the PipeWire bindings are generated at
      # build time, so the headers and clang have to be present. GTK 3 and
      # libappindicator are the tray icon's own Linux runtime dependencies;
      # the release tarball is no longer self-contained on Linux because of
      # them, which is what the .deb and the .rpm built below are for. The
      # tarball still ships, and the README lists what to install beside it.
      # libxcb-render0-dev, libxcb-shape0-dev, libxcb-xfixes0-dev and
      # libxkbcommon-dev are eframe's own native (winit/glow) build deps.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxfixes-dev \
            libxrandr-dev libpipewire-0.3-dev libspa-0.2-dev clang pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --locked

      - name: Build the Linux packages
        if: runner.os == 'Linux'
        run: |
          # Pinned, not latest. Both tools decide the artifact's filename:
          # cargo-deb's default Debian revision is what makes the file
          # pheme_0.1.0-1_amd64.deb rather than pheme_0.1.0_amd64.deb, and
          # a release that picked up a version changing that default would
          # silently rename what it publishes, or stop matching the upload
          # globs below. `@x.y.z` is an exact requirement, not a floor.
          # These are the versions this packaging was built and verified
          # against; packaging/verify-*.sh pin the same two.
          cargo install cargo-deb@3.8.0 cargo-generate-rpm@0.21.0 --locked
          # --no-build reuses the binary the previous step produced rather
          # than compiling the workspace a second time.
          cargo deb -p pheme-app --no-build --no-strip
          cargo generate-rpm -p crates/pheme-app
          cp target/debian/*.deb target/generate-rpm/*.rpm .

      # The only real test this sub-project has. A dependency that was
      # never declared fails the install; one declared wrongly fails the
      # run. Neither is visible from reading the manifest.
      #
      # This has to install inside a clean container, not on this runner:
      # the runner just ran "Linux build deps", so every runtime library the
      # .deb depends on is already present here. Ubuntu 24.04, not a Debian
      # image: cargo-deb's $auto resolved these Depends against this same
      # runner's dpkg database, so the .deb names Ubuntu 24.04's packages
      # (the post-time_t "t64" ones) and only an Ubuntu 24.04 container can
      # satisfy them.
      #
      # `pheme --version` is kept, but it is not the proof: clap exits
      # before anything is dlopen'd, so it cannot notice a missing libGL any
      # more than it noticed a missing appindicator. check-dlopen-sonames.sh
      # is the check that can fail, and it asks the loader directly.
      - name: The .deb installs and runs
        if: runner.os == 'Linux'
        run: |
          echo "--- Depends ---"
          dpkg-deb -f ./pheme_*_amd64.deb Depends
          docker run --rm -v "$PWD:/w" ubuntu:24.04 sh -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y /w/pheme_*_amd64.deb
            pheme --version
            sh /w/packaging/check-dlopen-sonames.sh
            for p in /usr/bin/pheme \
                     /usr/lib/udev/rules.d/80-pheme.rules \
                     /usr/lib/modules-load.d/pheme.conf \
                     /usr/lib/systemd/user/pheme.service \
                     /usr/share/applications/pheme.desktop \
                     /usr/share/icons/hicolor/32x32/apps/pheme.png; do
              test -f "$p" || { echo "MISSING: $p"; exit 1; }
            done
            # postinst runs again on upgrade; it must not fail the second time.
            apt-get install -y --reinstall /w/pheme_*_amd64.deb
            pheme --version
            apt-get remove -y pheme
            test ! -e /usr/bin/pheme || { echo "remove left the binary"; exit 1; }
          '

      - name: The .rpm installs and runs
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" fedora:latest sh -euxc '
            echo "--- Requires ---"
            rpm -qp --requires /w/pheme-*.x86_64.rpm
            dnf install -y /w/pheme-*.x86_64.rpm
            pheme --version
            # As on the .deb leg: --version cannot see a dlopen'd library,
            # so ask the loader for each one by name instead.
            sh /w/packaging/check-dlopen-sonames.sh
            for p in /usr/bin/pheme \
                     /usr/lib/udev/rules.d/80-pheme.rules \
                     /usr/lib/modules-load.d/pheme.conf \
                     /usr/lib/systemd/user/pheme.service \
                     /usr/share/applications/pheme.desktop \
                     /usr/share/icons/hicolor/32x32/apps/pheme.png; do
              test -f "$p" || { echo "MISSING: $p"; exit 1; }
            done
            # post_install_script re-runs on an upgrade and must not fail
            # there, the same property the .deb step checks for postinst.
            dnf reinstall -y /w/pheme-*.x86_64.rpm
            pheme --version
            dnf remove -y pheme
            test ! -e /usr/bin/pheme || { echo "remove left the binary"; exit 1; }
          '

      # Link the CRT statically on Windows. Without this the binary imports
      # VCRUNTIME140.dll, which a clean Windows install does not have, and it dies
      # at load time with no output at all — not even --version. A single-file CLI
      # should not require the Visual C++ redistributable.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/pheme
          cp target/release/pheme README.md LICENSE docs/testing.md dist/pheme/
          tar -C dist -czf pheme-${{ matrix.name }}.tar.gz pheme
          sha256sum pheme-${{ matrix.name }}.tar.gz > pheme-${{ matrix.name }}.tar.gz.sha256
          # The .deb and the .rpm were built and verified by the two steps
          # above; checksum them here too, alongside the tarball.
          for f in pheme_*_amd64.deb pheme-*.x86_64.rpm; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pheme | Out-Null
          Copy-Item target/release/pheme.exe, README.md, LICENSE, docs/testing.md dist/pheme/
          Compress-Archive -Path dist/pheme -DestinationPath pheme-${{ matrix.name }}.zip
          (Get-FileHash pheme-${{ matrix.name }}.zip -Algorithm SHA256).Hash `
            | Out-File -Encoding ascii pheme-${{ matrix.name }}.zip.sha256

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The script uses x64compatible, which Inno Setup understands only
          # from 6.3. Test-Path alone would pass on a runner image that
          # ships an older 6.x, and the compile would then fail on an
          # unknown identifier after the whole matrix has already built.
          # Check the version, not just presence, and re-check it after an
          # upgrade too: a failed choco upgrade that leaves the old binary
          # in place must not read as success just because the file exists.
          function Get-IsccVersion($p) {
            if (-not (Test-Path $p)) { return $null }
            try { return [version](Get-Item $p).VersionInfo.ProductVersion } catch { return $null }
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $needed = [version]'6.3'
          $have = Get-IsccVersion $iscc
          if (-not $have -or $have -lt $needed) {
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco upgrade innosetup exited $LASTEXITCODE" }
            $have = Get-IsccVersion $iscc
          }
          if (-not $have -or $have -lt $needed) {
            throw "Inno Setup $needed or newer is required at $iscc; found '$have'"
          }
          $version = ((cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'pheme-app' }).version
          & $iscc "/DAppVersion=$version" packaging\windows\pheme.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Copy-Item packaging\windows\Output\*.exe .
          # Checksum the installer alongside the zip, the same way the Linux
          # job checksums the .deb and the .rpm alongside the tarball.
          $exe = (Get-ChildItem pheme-*-setup.exe)[0]
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash `
            | Out-File -Encoding ascii "$($exe.Name).sha256"

      - name: The installer installs, runs and uninstalls
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem pheme-*-setup.exe)[0].FullName
          $p = Start-Process -Wait -PassThru $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/TASKS=startup,addtopath'
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          # Again, over the top, with the PATH task ticked both times. The
          # Check guard in the script is the only thing stopping the
          # directory being appended twice, and nothing else exercises it.
          # This is the run that actually matters: the first install is
          # also checked by the Test-Path below, but nothing else notices
          # if this second, over-the-top run silently fails.
          $p = Start-Process -Wait -PassThru $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/TASKS=startup,addtopath'
          if ($p.ExitCode -ne 0) { throw "the reinstall exited $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Pheme"
          if (-not (Test-Path "$app\pheme.exe")) { throw "pheme.exe was not installed" }
          & "$app\pheme.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "the installed binary does not run" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
                   -Name Pheme -ErrorAction SilentlyContinue
          if (-not $run) { throw "the startup task did not write its Run value" }
          $path = (Get-ItemProperty 'HKCU:\Environment' -Name Path).Path
          $hits = ($path -split ';' | Where-Object { $_ -eq $app }).Count
          if ($hits -ne 1) { throw "PATH holds the directory $hits times, expected once" }

          $p = Start-Process -Wait -PassThru "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited $($p.ExitCode)" }
          # unins000.exe relaunches a copy of itself from %TEMP% so it can
          # delete its own directory, and the process we waited on returns
          # before that second phase finishes. Poll the LAST signal to
          # change, not the first: Inno removes the files and the Run value
          # during its standard uninstall pass, and RemovePath runs after
          # that, at usPostUninstall, so PATH can still name the directory
          # after the binary is already gone. Poll all three together and
          # assert each separately, so a timeout says which one was wrong.
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $gone = -not (Test-Path "$app\pheme.exe")
            $run  = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' `
                      -Name Pheme -ErrorAction SilentlyContinue
            $path = (Get-ItemProperty 'HKCU:\Environment' -Name Path -ErrorAction SilentlyContinue).Path
            $pathClean = -not (($path -split ';') -contains $app)
            if ($gone -and -not $run -and $pathClean) { break }
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)

          if (-not $gone)      { throw "uninstall left the binary behind" }
          if ($run)            { throw "uninstall left the Run value behind" }
          if (-not $pathClean) { throw "uninstall left the PATH entry behind" }

      # if-no-files-found: error below only notices a *completely* empty
      # match; the tarball or the zip alone still satisfies it, so a
      # missing .deb, .rpm or installer would otherwise upload silently.
      - name: Check the expected artifacts exist
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          for g in "pheme-${{ matrix.name }}.tar.gz" "pheme_*_amd64.deb" "pheme-*.x86_64.rpm"; do
            files=($g)
            test "${#files[@]}" -ge 1 || { echo "MISSING artifact: $g"; exit 1; }
          done

      - name: Check the expected artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($g in @("pheme-${{ matrix.name }}.zip", "pheme-*-setup.exe")) {
            if (-not (Get-ChildItem $g -ErrorAction SilentlyContinue)) { throw "MISSING artifact: $g" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pheme-${{ matrix.name }}
          path: |
            pheme-${{ matrix.name }}.*
            pheme_*.deb*
            pheme-*.rpm*
            pheme-*-setup.exe*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # gh is preinstalled on the runner, so no third-party release action is needed.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $(find artifacts -type f | sort)
