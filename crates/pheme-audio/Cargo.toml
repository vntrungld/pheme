[package]
name = "pheme-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rtrb = { workspace = true }
rubato = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# "v0_3_32" is the minimum feature that unlocks `keys::AUDIO_RATE`, which is
# the only key we use that's version-gated at all (`AUDIO_CHANNELS` and
# `NODE_LATENCY` are not). Do not raise this casually: higher gates such as
# "v1_2_0" transitively enable "spa/v1_2_0", which compiles against libspa
# symbols only present in much newer headers, silently raising the real
# minimum buildable libpipewire far past what this crate actually needs.
pipewire = { version = "0.10", features = ["v0_3_32"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
