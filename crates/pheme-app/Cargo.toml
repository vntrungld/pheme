[package]
name = "pheme-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pheme"
path = "src/main.rs"

[dependencies]
pheme-proto = { workspace = true }
pheme-core = { workspace = true }
pheme-input = { workspace = true }
pheme-net = { workspace = true }
pheme-clip = { workspace = true }
pheme-audio = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
tokio = { workspace = true, features = ["process"] }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true }
png = { workspace = true }
eframe = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Only the platforms `tray-icon`'s "gtk" feature actually targets need a way
# to ask D-Bus whether a tray host is listening, and only they need GTK
# itself: its Linux backend is GTK-based and panics unless something has
# called `gtk::init()` and is pumping its event loop, which is `frontend::run`'s
# job (see the manual smoke test below `tray.rs` for the same pattern by hand:
# `cargo test -p pheme-app --lib frontend::tray::tests::manual_smoke --
# --ignored --nocapture`). Windows and macOS have their own tray hosts built
# into the shell, so neither dependency is asked of them.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { workspace = true }
gtk = "0.18"
