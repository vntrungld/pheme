[package]
name = "pheme-app"
# Keep this at 79 characters or fewer, and keep it the same text as
# [package.metadata.generate-rpm]'s `summary` below. cargo-deb has no way to
# override the .deb's synopsis -- it always takes this field and hard-wraps
# it at 79 -- so at 80 characters the shipped control file's Description:
# line ended mid-phrase at "...over the" and the extended description then
# opened with a paragraph consisting of the single word "LAN", which is what
# `apt search pheme` and `apt show pheme` displayed. The full sentence,
# "over the LAN" included, is in the extended description and in the README.
description = "Share one keyboard, mouse, clipboard and audio between two machines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pheme"
path = "src/main.rs"

[dependencies]
pheme-proto = { workspace = true }
pheme-core = { workspace = true }
pheme-input = { workspace = true }
pheme-net = { workspace = true }
pheme-clip = { workspace = true }
pheme-display = { workspace = true }
pheme-audio = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
tokio = { workspace = true, features = ["process"] }
crossbeam-channel = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true }
png = { workspace = true }
eframe = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Only the platforms `tray-icon`'s "gtk" feature actually targets need a way
# to ask D-Bus whether a tray host is listening, and only they need GTK
# itself: its Linux backend is GTK-based and panics unless something has
# called `gtk::init()` and is pumping its event loop, which is `frontend::run`'s
# job (see the manual smoke test below `tray.rs` for the same pattern by hand:
# `cargo test -p pheme-app --lib frontend::tray::tests::manual_smoke --
# --ignored --nocapture`). Windows and macOS have their own tray hosts built
# into the shell, so neither dependency is asked of them.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { workspace = true }
gtk = "0.18"

# The binary's own path is written `target/release/pheme` on purpose, with
# no `../../`: cargo-deb matches that exact prefix to work out what to
# build and substitutes the real target directory itself, and its own
# README warns that "correcting" the path breaks it. Every other source is
# relative to this manifest's directory, which is why they carry `../../`.
[package.metadata.deb]
name = "pheme"
maintainer = "Lam Duc Trung <oedevai7@gmail.com>"
copyright = "2026 Lam Duc Trung"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """
Pheme shares one keyboard, mouse, clipboard and audio stream between two \
machines on the same network. The pointer crosses the screen edge and the \
input follows it; a monitor cabled to both machines can follow it too."""
# $auto asks dpkg which package provides each soname ldd reports, so the
# dependency list is derived from the binary that was built rather than
# remembered. It only sees DT_NEEDED, so every library this binary opens
# with dlopen has to be named here instead: the tray's appindicator, the
# GL/EGL stack glutin loads to make a context, and the X11, XCB, xkbcommon
# and Wayland libraries winit loads to talk to whichever display server is
# running. `packaging/verify-deb.sh` and the release workflow assert that
# each of these sonames resolves after the package is installed in a clean
# container, which is the check that catches an addition nobody declared.
#
# Both display-server families are declared even though a given machine
# runs only one of them: Depends cannot express "X11 or Wayland", every one
# of these packages is small, and GTK 3 pulls most of them in anyway. The
# alternative is a Depends that is honest on half the machines.
depends = """\
$auto, libayatana-appindicator3-1 | libappindicator3-1, \
libgl1, libegl1, \
libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxrender1, \
libxkbcommon0, libxkbcommon-x11-0, \
libwayland-client0, libwayland-egl1"""
assets = [
    ["target/release/pheme", "usr/bin/", "755"],
    ["../../packaging/linux/80-pheme.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../packaging/linux/pheme-modules.conf", "usr/lib/modules-load.d/pheme.conf", "644"],
    ["../../packaging/linux/pheme.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/linux/pheme.desktop", "usr/share/applications/", "644"],
    ["assets/tray-connected.png", "usr/share/icons/hicolor/32x32/apps/pheme.png", "644"],
    ["../../README.md", "usr/share/doc/pheme/", "644"],
    ["../../docs/testing.md", "usr/share/doc/pheme/", "644"],
]
maintainer-scripts = "../../packaging/debian/"

# Asset sources here resolve against the working directory the command is
# run from -- the workspace root -- which is why these carry no `../../`,
# unlike the cargo-deb block above. `dest` is absolute here and relative
# there. The two tools disagree about both.
[package.metadata.generate-rpm]
name = "pheme"
# Deliberately the same text as the crate's `description`, which is what the
# .deb's synopsis is forced to be; both packages then show one synopsis.
summary = "Share one keyboard, mouse, clipboard and audio between two machines"
assets = [
    { source = "target/release/pheme", dest = "/usr/bin/pheme", mode = "755" },
    { source = "packaging/linux/80-pheme.rules", dest = "/usr/lib/udev/rules.d/80-pheme.rules", mode = "644" },
    { source = "packaging/linux/pheme-modules.conf", dest = "/usr/lib/modules-load.d/pheme.conf", mode = "644" },
    { source = "packaging/linux/pheme.service", dest = "/usr/lib/systemd/user/pheme.service", mode = "644" },
    { source = "packaging/linux/pheme.desktop", dest = "/usr/share/applications/pheme.desktop", mode = "644" },
    { source = "crates/pheme-app/assets/tray-connected.png", dest = "/usr/share/icons/hicolor/32x32/apps/pheme.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/pheme/README.md", mode = "644" },
    { source = "docs/testing.md", dest = "/usr/share/doc/pheme/testing.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/pheme/LICENSE", mode = "644" },
]
post_install_script = """
modprobe uinput || true
modprobe i2c-dev || true
udevadm control --reload || true
udevadm trigger --name-match=uinput || true
udevadm trigger --subsystem-match=i2c-dev || true
"""

# Sonames rather than package names: what provides them differs between
# Fedora and openSUSE, the soname does not. Automatic requirement detection
# reads the ELF header, so it finds none of these -- they are opened with
# dlopen at runtime. The list is the same one the .deb's `depends` names
# above, derived from the binary with `readelf -d` for what is linked and
# `strings` for what is not.
#
# All of them are declared even though a Fedora install today happens to
# pull in every one but libxkbcommon-x11.so.0 through gtk3's own
# requirements. A transitive accident is not a dependency: it holds until
# gtk3 drops one, and then it holds nowhere.
[package.metadata.generate-rpm.requires]
"libayatana-appindicator3.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libxcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libXrender.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"
