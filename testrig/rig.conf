# Declares the rig. Sourced by every script in this directory, so it is the
# one place to read what the rig consists of.
#
# A NAT network of its own, not libvirt's `default` and not a bridge onto the
# real LAN: provisioning needs outbound internet for apt, the two VMs must
# share one layer-2 segment for mDNS multicast, and pheme must never
# advertise itself onto the network the developer is using.
RIG_NET=pheme-rig
RIG_NET_CIDR=192.168.140.0/24

UBUNTU_VM=pheme-ubuntu
UBUNTU_RAM_MB=4096
UBUNTU_DISK_GB=40

# Windows 11 wants more of both, and Setup fails on less.
WINDOWS_VM=pheme-windows
WINDOWS_RAM_MB=8192
WINDOWS_DISK_GB=64

# POSIX sh cannot name the file being sourced, so this is found from the
# working directory: the scripts here cd into testrig/ before sourcing, and a
# person at a prompt sources it from the repository root.
if [ -f ./rig.conf ]; then
    RIG_DIR="$(pwd)"
else
    RIG_DIR="$(pwd)/testrig"
fi
RIG_SSH_KEY="$RIG_DIR/id_rig"
RIG_STATE="$RIG_DIR/.state"
